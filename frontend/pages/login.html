<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | Lanchonete do Pimentel</title>
    <link rel="stylesheet" href="/site.css" />
    <link rel="stylesheet" href="/premium-theme.css" />
    <link rel="stylesheet" href="/auth.css" />
    <link rel="stylesheet" href="/login-simple.css" />
  </head>
  <body data-page="login">
    <main class="pagina-login">
      <section class="login-premium">
        <img
          class="selo-login foto-lanchonete-login"
          src="/images/lanchonete-login.png"
          alt="Fachada da Lanchonete do Pimentel"
        />
        <p class="chamada">BEM-VINDO</p>
        <h1>Lanchonete do Pimentel</h1>
        <p>O lugar preferido do professor Stati</p>
        <form id="form-login" novalidate>
          <label
            >Nome<input
              id="nome-login"
              autocomplete="name"
              placeholder="Digite seu nome" /></label
          ><label
            >E-mail<input
              id="email-login"
              type="email"
              autocomplete="email"
              placeholder="nome@email.com" /></label
          ><label
            >Senha<input
              id="senha-login"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
          /></label>
          <p class="mensagem-login">Acesse o cardápio e faça seu pedido.</p>
          <button type="submit">Entrar</button>
        </form>
      </section>
    </main>
    <script type="module" src="/site.js"></script>
  </body>
</html>

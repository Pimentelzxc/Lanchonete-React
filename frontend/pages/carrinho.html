<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Carrinho | Lanchonete do Pimentel</title>
    <link rel="stylesheet" href="/site.css" />
    <link rel="stylesheet" href="/header.css" />
    <link rel="stylesheet" href="/carrinho.css" />
    <link rel="stylesheet" href="/premium-theme.css" />
  </head>
  <body data-page="carrinho">
    <header class="titulo">
      <div class="linha-titulo">
        <h1>Lanchonete Do Pimentel</h1>
        <a
          class="carrinho-header"
          href="/pages/carrinho.html"
          aria-label="Abrir carrinho"
          >🛒<b data-cart-count></b
        ></a>
      </div>
      <h2>O lugar preferido do professor Stati</h2>
    </header>
    <nav>
      <a href="/pages/cardapio.html">Cardápio</a
      ><a href="/pages/cozinha.html">Cozinha <b data-order-count></b></a
      ><a href="/pages/atendentes.html">Atendentes</a
      ><a href="/pages/conta.html">Minha conta</a>
    </nav>
    <main class="pagina-carrinho">
      <section class="carrinho">
        <h2>Carrinho</h2>
        <div id="itens-carrinho"></div>
        <label
          >Cliente / mesa<input
            id="cliente"
            placeholder="Ex.: Mesa 04 ou João" /></label
        ><label
          >Observações<textarea
            id="observacao"
            rows="2"
            placeholder="Ex.: sem cebola"
          ></textarea>
        </label>
        <div class="total">
          <span>Total</span><strong id="total">R$ 0,00</strong>
        </div>
        <button id="enviar-pedido" class="botao-principal">
          Enviar para a cozinha
        </button>
        <p id="mensagem"></p>
      </section>
    </main>
    <script type="module" src="/site.js"></script>
  </body>
</html>
